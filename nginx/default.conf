  server {
    listen 80;                            # Escucha peticiones HTTP en el puerto 80.
    server_name localhost;                # Define el nombre del host para este servidor; en este caso, localhost.

    location / {                          # Define cómo responder a todas las rutas que no coincidan con otras reglas.
        root /usr/share/nginx/html;       # Establece la carpeta raíz desde la que NGINX sirve archivos estáticos.
        index index.html;                 # Si la URL apunta a un directorio, intenta cargar index.html.
        try_files $uri $uri/ /index.html; # Intenta servir el archivo solicitado; si no existe, devuelve /index.html.
    }

    location /api/ {                       # Define una regla especial para todas las rutas que comienzan con /api/.
        # proxy_pass http://api:8000;        # Reenvía la petición al servicio API dentro de Docker, en el puerto 8000.
        proxy_pass http://127.0.0.1:8000;        # Reenvía la petición al servicio API dentro de Docker, en el puerto 8000.
        proxy_http_version 1.1;            # Usa HTTP/1.1 para la conexión proxy.
        proxy_set_header Host $host;       # Mantiene el Host original del cliente al hacer el proxy.
        proxy_set_header X-Real-IP $remote_addr; # Pasa la IP real del cliente al backend.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Agrega la cadena de IPs que pasaron por NGINX.
        proxy_set_header X-Forwarded-Proto $scheme; # Informa al backend si la petición fue HTTP o HTTPS.
    }

    location /docs {                       # Define una ruta especial para la documentación Swagger/OpenAPI.
        proxy_pass http://api:8000/docs;   # Redirige /docs al endpoint docs del backend.
    }
    location /openapi.json {               # Define una ruta especial para el archivo OpenAPI JSON.
        proxy_pass http://api:8000/openapi.json; # Redirige /openapi.json al endpoint equivalente en la API.
    }
}
