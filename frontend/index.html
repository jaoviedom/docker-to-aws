<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Productos</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: rgba(255, 255, 255, 0.9);
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #0ea5e9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbeafe;
            --success: #10b981;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 40%, #eefdf7 100%);
            color: var(--text);
        }

        .app {
            width: min(100%, 760px);
            background: var(--card);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            padding: 32px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 0;
            font-size: clamp(2rem, 4vw, 2.5rem);
            line-height: 1.1;
            color: var(--text);
        }

        .subtitle {
            color: var(--muted);
            margin: 6px 0 0;
            font-size: 0.98rem;
        }

        form {
            display: grid;
            grid-template-columns: 1.5fr 1fr auto;
            gap: 12px;
            margin-bottom: 28px;
        }

        .field {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
            font-size: 1rem;
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 22px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .list-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text);
        }

        .count {
            background: rgba(16, 185, 129, 0.12);
            color: #047857;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
        }

        .product-name {
            font-weight: 700;
            color: var(--text);
            font-size: 1rem;
        }

        .product-price {
            font-weight: 800;
            color: var(--success);
            background: rgba(16, 185, 129, 0.08);
            border-radius: 999px;
            padding: 8px 12px;
            min-width: 90px;
            text-align: center;
        }

        .empty {
            text-align: center;
            padding: 28px 16px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            background: rgba(148, 163, 184, 0.04);
            color: var(--muted);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .app {
                padding: 22px 18px;
            }

            form {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }

            li {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="header">
            <div>
                <span class="badge">Inventario</span>
                <h1>Catálogo de Productos</h1>
            </div>
            <p class="subtitle">Gestiona tus artículos de forma rápida</p>
        </div>

        <form id="productForm">
            <div class="field">
                <input type="text" id="name" placeholder="Nombre del producto" required />
            </div>
            <div class="field">
                <input type="number" id="price" placeholder="Precio ($)" min="0" step="0.01" required />
            </div>
            <button type="submit">Agregar</button>
        </form>

        <div class="list-header">
            <h2>Productos actuales</h2>
            <span class="count" id="productCount">0</span>
        </div>

        <ul id="productList"></ul>
    </main>

    <script>
        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('No se pudo cargar la lista');

                const items = await res.json();
                const products = Array.isArray(items) ? items : [];
                const list = document.getElementById('productList');
                const count = document.getElementById('productCount');

                count.textContent = products.length;

                if (products.length === 0) {
                    list.innerHTML = '<li class="empty">Todavía no hay productos agregados.</li>';
                    return;
                }

                list.innerHTML = products.map(p => `
                    <li>
                        <span class="product-name">${p.name}</span>
                        <span class="product-price">$${Number(p.price || 0).toFixed(2)}</span>
                    </li>
                `).join('');
            } catch (error) {
                document.getElementById('productList').innerHTML = '<li class="empty">Error al cargar los productos.</li>';
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const price = document.getElementById('price').value;

            if (!name || !price) return;

            await fetch(`/api/products?name=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`, {
                method: 'POST'
            });

            document.getElementById('productForm').reset();
            fetchProducts();
        });

        fetchProducts();
    </script>
</body>

</html>
